<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 테스트 - 작가 (Photographer B)</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 90vh;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .config-section {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .config-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .config-section input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .config-section input:last-child {
            margin-bottom: 0;
        }
        .connection-status {
            padding: 10px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s infinite;
        }
        .status-dot.connected {
            background: #28a745;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn-connect {
            padding: 8px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-connect.connect {
            background: #28a745;
            color: white;
        }
        .btn-connect.disconnect {
            background: #dc3545;
            color: white;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.sent {
            justify-content: flex-end;
        }
        .message.received {
            justify-content: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message-info {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }
        .message.sent .message-info {
            text-align: right;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        #messageInput:focus {
            border-color: #f093fb;
        }
        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }
        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .system-message {
            text-align: center;
            color: #6c757d;
            font-size: 12px;
            margin: 10px 0;
            padding: 8px;
            background: #e9ecef;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>작가 B (Photographer)</h1>
            <p>Room ID: <span id="roomIdDisplay">1</span></p>
        </div>

        <div class="config-section">
            <label>JWT Access Token (Bearer 제외)</label>
            <input type="text" id="jwtToken" placeholder="JWT 토큰을 입력하세요">
            <label>채팅방 ID</label>
            <input type="number" id="roomId" value="1" min="1">
        </div>

        <div class="connection-status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">연결 안됨</span>
            </div>
            <button class="btn-connect connect" id="connectBtn" onclick="toggleConnection()">연결</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." disabled>
                <button id="sendButton" disabled>전송</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const BASE_URL = 'http://localhost:8080/api/v1';
        const WS_URL = BASE_URL + '/ws';

        let stompClient = null;
        let isConnected = false;
        let currentMemberId = null;

        // DOM Elements
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const jwtTokenInput = document.getElementById('jwtToken');
        const roomIdInput = document.getElementById('roomId');
        const connectBtn = document.getElementById('connectBtn');

        // Room ID 변경 시 화면 업데이트
        roomIdInput.addEventListener('change', function() {
            roomIdDisplay.textContent = this.value;
        });

        // 연결/해제 토글
        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        // WebSocket 연결
        function connect() {
            const token = jwtTokenInput.value.trim();
            const roomId = roomIdInput.value;

            if (!token) {
                alert('JWT 토큰을 입력해주세요.\n\n테스트용 토큰 발급:\nGET /auth/test?memberId=2');
                return;
            }

            if (!roomId) {
                alert('채팅방 ID를 입력해주세요.');
                return;
            }

            // JWT에서 memberId 추출 시도
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentMemberId = parseInt(payload.sub);
                console.log('Member ID from token:', currentMemberId);
            } catch (e) {
                console.warn('JWT 파싱 실패, memberId를 알 수 없습니다.');
                currentMemberId = null;
            }

            addSystemMessage('WebSocket 연결 시도 중...');

            // SockJS + STOMP 연결
            const socket = new SockJS(WS_URL);
            stompClient = Stomp.over(socket);

            // 디버그 로그 활성화
            stompClient.debug = function(str) {
                console.log('STOMP: ' + str);
            };

            // 연결 헤더에 JWT 토큰 추가
            const headers = {
                'Authorization': 'Bearer ' + token
            };

            stompClient.connect(headers,
                function(frame) {
                    // 연결 성공
                    console.log('Connected: ' + frame);
                    isConnected = true;
                    updateConnectionStatus(true);
                    addSystemMessage('채팅방 ' + roomId + '에 연결되었습니다.');

                    // 채팅방 구독
                    stompClient.subscribe('/topic/room/' + roomId, function(message) {
                        console.log('메시지 수신:', message.body);
                        try {
                            const msg = JSON.parse(message.body);
                            displayMessage(msg);
                        } catch (e) {
                            console.error('메시지 파싱 실패:', e);
                        }
                    });

                    // 입력 활성화
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();

                    // 버튼 상태 변경
                    connectBtn.textContent = '연결 해제';
                    connectBtn.classList.remove('connect');
                    connectBtn.classList.add('disconnect');
                },
                function(error) {
                    // 연결 실패
                    console.error('Connection error:', error);
                    isConnected = false;
                    updateConnectionStatus(false);
                    addSystemMessage('연결 실패: ' + (error.headers ? error.headers.message : error));
                }
            );
        }

        // 연결 해제
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect(function() {
                    console.log('Disconnected');
                    isConnected = false;
                    updateConnectionStatus(false);
                    addSystemMessage('연결이 해제되었습니다.');

                    messageInput.disabled = true;
                    sendButton.disabled = true;

                    connectBtn.textContent = '연결';
                    connectBtn.classList.remove('disconnect');
                    connectBtn.classList.add('connect');
                });
            }
        }

        // 메시지 전송
        function sendMessage() {
            const content = messageInput.value.trim();
            const roomId = roomIdInput.value;

            if (!content || !isConnected) return;

            const message = {
                roomId: parseInt(roomId),
                type: 'TEXT',
                content: content
            };

            stompClient.send('/app/chat/message', {}, JSON.stringify(message));
            console.log('메시지 전송:', message);

            messageInput.value = '';
            messageInput.focus();
        }

        // 메시지 표시
        function displayMessage(message) {
            const messageDiv = document.createElement('div');
            const isSent = message.sender && message.sender.id === currentMemberId;
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';

            const contentDiv = document.createElement('div');
            contentDiv.textContent = message.content;
            bubbleDiv.appendChild(contentDiv);

            const infoDiv = document.createElement('div');
            infoDiv.className = 'message-info';
            const time = message.createdAt ? new Date(message.createdAt).toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';
            const senderName = message.sender ? message.sender.name : '알 수 없음';
            const senderRole = message.sender ? message.sender.role : '';
            infoDiv.textContent = `${senderName} (${senderRole}) · ${time}`;
            bubbleDiv.appendChild(infoDiv);

            messageDiv.appendChild(bubbleDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 시스템 메시지 표시
        function addSystemMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 연결 상태 업데이트
        function updateConnectionStatus(connected) {
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = '연결됨';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = '연결 안됨';
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
